name: Feature request
description: Propose an addition to the SDK
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
