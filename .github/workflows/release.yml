name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance / trusted publishing

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Publishing is enabled once an NPM_TOKEN secret (or trusted publishing) is configured.
      CAN_PUBLISH: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run ci
      - name: Version PR or publish
        if: env.CAN_PUBLISH == 'true'
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npx changeset version
          publish-script: npx changeset publish
          pr-title: "chore: release"
          commit-message: "chore: release"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
      - name: Version PR only (npm publishing not configured)
        if: env.CAN_PUBLISH != 'true'
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npx changeset version
          pr-title: "chore: release"
          commit-message: "chore: release"
